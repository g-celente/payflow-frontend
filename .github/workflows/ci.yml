name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Regras de arquitetura (dependency-cruiser) e testes de componente (Vitest + Testing Library).
      - run: npm test
      - run: npm run build

  # Publica docker.io/<DOCKERHUB_USERNAME>/payflow-frontend:<tag> quando uma tag v* é enviada.
  # Precisa dos secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN.
  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/payflow-frontend:${{ github.ref_name }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/payflow-frontend:latest

  # Publica os três apps no S3 (Shell na raiz, remotes em /mfe-payments/ e /mfe-account/) e limpa o
  # cache do CloudFront só do que não tem hash no nome. Roda em tags v* quando a variável FRONTEND_BUCKET existe.
  # Variáveis: AWS_REGION, FRONTEND_BUCKET, CLOUDFRONT_DISTRIBUTION_ID, API_BASE_URL.
  # Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN (AWS Academy), GATEWAY_API_KEY.
  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') && vars.FRONTEND_BUCKET != ''
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      VITE_GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
      VITE_MFE_PAYMENTS_URL: /mfe-payments/remoteEntry.js
      VITE_MFE_ACCOUNT_URL: /mfe-account/remoteEntry.js
      SHELL_BASE: /
      MFE_PAYMENTS_BASE: /mfe-payments/
      MFE_ACCOUNT_BASE: /mfe-account/
      BUCKET: ${{ vars.FRONTEND_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Upload to S3
        run: |
          aws s3 sync apps/mfe-payments/dist "s3://$BUCKET/mfe-payments/" --delete
          aws s3 sync apps/mfe-account/dist "s3://$BUCKET/mfe-account/" --delete
          aws s3 sync apps/shell/dist "s3://$BUCKET/" --delete --exclude "mfe-payments/*" --exclude "mfe-account/*"
          for file in index.html mfe-payments/remoteEntry.js mfe-account/remoteEntry.js; do
            aws s3 cp "s3://$BUCKET/$file" "s3://$BUCKET/$file" --metadata-directive REPLACE \
              --cache-control no-cache --content-type "$( [[ $file == *.html ]] && echo text/html || echo text/javascript )"
          done
      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/index.html" "/mfe-payments/remoteEntry.js" "/mfe-account/remoteEntry.js"
